<body>
  <div id="root"></div>
  <script>
    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var host = document.getElementById('root');
    var tiles = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'tile h' + (i % 200);
      el.appendChild(document.createElement('div'));
      el.firstChild.className = 'inner';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      host.appendChild(el);
      tiles.push(el);
    }

    var t = 0;
    function frame() {
      t += 1;
      host.style.transform = 'translateX(' + (t % 3) + 'px)';
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
