<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile {
    position: absolute;
    width: 88px;
    height: 64px;
    background: #3a7ab0;
    clip-path: polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%);
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // B rewrites the clip polygon every frame; A keeps the one from the
    // stylesheet. Both pages carry both paths so the scripts stay
    // byte-identical apart from this one constant.
    var ANIMATE_CLIP = true;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var tiles = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      root.appendChild(el);
      tiles.push(el);
    }

    // Both variants are clipped and both re-render every frame. The question is
    // whether re-evaluating the path each frame costs more than a fixed one.
    var t = 0;
    function frame() {
      t += 1;
      if (ANIMATE_CLIP) {
        var k = 5 + (t % 15);
        var poly = 'polygon(' + k + '% 0%, 100% 0%, ' + (100 - k) + '% 100%, 0% 100%)';
        for (var j = 0; j < tiles.length; j++) tiles[j].style.clipPath = poly;
      }
      root.style.transform = 'translateX(' + (t % 3) + 'px)';
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
