<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .bar { position: absolute; height: 20px; background: #3a7ab0; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A batches every write before every read; B interleaves them one element
    // at a time. Both pages carry both paths so the scripts stay byte-identical
    // apart from this one constant.
    var INTERLEAVE = false;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var bars = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'bar';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      el.style.width = '88px';
      root.appendChild(el);
      bars.push(el);
    }

    // Reads accumulate here so neither variant's reads can be optimised away.
    var sink = 0;

    // The write/read pattern IS the case, so it replaces the shared damage
    // driver (AUTHORING.md rule 6). Both variants perform exactly the same
    // number of writes and the same number of reads - only the order differs.
    var t = 0;
    function frame() {
      t += 1;
      var w = 40 + ((t % 48));
      if (INTERLEAVE) {
        for (var j = 0; j < bars.length; j++) {
          bars[j].style.width = w + 'px';
          sink += bars[j].getBoundingClientRect().width;
        }
      } else {
        for (var k = 0; k < bars.length; k++) bars[k].style.width = w + 'px';
        for (var m = 0; m < bars.length; m++) sink += bars[m].getBoundingClientRect().width;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
