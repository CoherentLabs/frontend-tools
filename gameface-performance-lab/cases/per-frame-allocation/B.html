<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile {
    position: absolute; width: 88px; height: 64px; border-radius: 6px;
    background: #2a4a6a; color: #e8e8f0; font-size: 16px;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A mutates a pre-allocated set of objects; B allocates a fresh array of
    // fresh objects every frame. Both pages carry both paths so the scripts stay
    // byte-identical apart from this one constant.
    var ALLOCATE = true;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var tiles = [];
    var pool = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      root.appendChild(el);
      tiles.push(el);
      pool.push({ x: 0 });
    }

    // Both variants end up writing the same numbers to the same tiles. The only
    // difference is whether the intermediate objects are recycled or discarded.
    var t = 0;
    function frame() {
      t += 1;
      var items;
      if (ALLOCATE) {
        items = [];
        for (var j = 0; j < COUNT; j++) items.push({ x: (t + j) % 1000 });
      } else {
        items = pool;
        for (var k = 0; k < COUNT; k++) pool[k].x = (t + k) % 1000;
      }
      for (var m = 0; m < COUNT; m++) tiles[m].textContent = items[m].x;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
