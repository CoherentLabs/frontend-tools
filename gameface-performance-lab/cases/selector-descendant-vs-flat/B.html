<body>
  <div id="root">
    <div class="lvl1">
      <div class="lvl2"></div>
    </div>
  </div>
  <script>
    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68, RULE_COUNT = 500;

    var host = document.querySelector('.lvl2');
    var tiles = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'tile r' + (i % RULE_COUNT);
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      host.appendChild(el);
      tiles.push(el);
    }

    // The class churn IS the case, so it replaces the shared damage driver
    // (AUTHORING.md rule 6). Every tile restyles every frame, which is what
    // forces the engine to re-match it against the whole rule set.
    var t = 0;
    function frame() {
      t += 1;
      var on = (t % 2) === 0;
      for (var j = 0; j < tiles.length; j++) {
        if (on) tiles[j].classList.add('hot');
        else tiles[j].classList.remove('hot');
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
