<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile { position: absolute; width: 88px; height: 64px; background: #2a4a6a; border-radius: 6px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // B additionally mounts COUNT tiles parked far below the viewport.
    // Both pages carry both paths so the scripts stay byte-identical apart
    // from this one constant.
    var MOUNT_OFFSCREEN = true;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 1000;

    var COLS = 20, CELL_W = 92, CELL_H = 68;
    // The visible set is fixed in both variants, so anything the row shows is
    // attributable to the offscreen nodes and nothing else.
    var VISIBLE = 100;

    var root = document.getElementById('root');

    function makeTile(left, top) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.style.left = left + 'px';
      el.style.top = top + 'px';
      return el;
    }

    for (var i = 0; i < VISIBLE; i++) {
      root.appendChild(makeTile(16 + (i % COLS) * CELL_W, 16 + Math.floor(i / COLS) * CELL_H));
    }

    if (MOUNT_OFFSCREEN) {
      // Parked well below a 1080-tall viewport: mounted, laid out, styled -
      // but never drawn.
      for (var j = 0; j < COUNT; j++) {
        root.appendChild(makeTile(16 + (j % COLS) * CELL_W, 2000 + Math.floor(j / COLS) * CELL_H));
      }
    }

    var t = 0;
    function frame() {
      t += 1;
      root.style.transform = 'translateX(' + (t % 3) + 'px)';
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
