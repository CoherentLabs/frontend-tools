<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile { position: absolute; border-radius: 6px; background: #2a4a6a; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A writes each property directly; B rebuilds the whole inline style as a
    // string. Both pages carry both paths so the scripts stay byte-identical
    // apart from this one constant.
    var USE_CSSTEXT = true;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var tiles = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'tile';
      root.appendChild(el);
      tiles.push(el);
    }

    // Both variants set exactly the same four declarations every frame. The
    // cssText form necessarily includes all of them, because assigning cssText
    // replaces the entire inline style rather than amending it.
    var t = 0;
    function frame() {
      t += 1;
      for (var j = 0; j < tiles.length; j++) {
        var left = 16 + (j % COLS) * CELL_W;
        var top = 16 + Math.floor(j / COLS) * CELL_H;
        var width = 40 + ((t + j) % 48);
        if (USE_CSSTEXT) {
          tiles[j].style.cssText = 'left:' + left + 'px;top:' + top + 'px;width:' + width + 'px;height:64px';
        } else {
          tiles[j].style.left = left + 'px';
          tiles[j].style.top = top + 'px';
          tiles[j].style.width = width + 'px';
          tiles[j].style.height = '64px';
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
