<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile {
    position: absolute;
    width: 88px;
    height: 64px;
    border-radius: 6px;
    background: #4a2a6a;
    color: #e8e8f0;
    font-size: 18px;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A reuses a fixed pool of elements; B destroys and recreates them every
    // cycle. Both pages carry both paths so the scripts stay byte-identical
    // apart from this one constant.
    var USE_POOL = true;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var t = 0;

    function makeTile() {
      var el = document.createElement('div');
      el.className = 'tile';
      return el;
    }

    function refresh(el, i) {
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      el.textContent = ((t + i * 7) % 1000);
    }

    var tiles = [];
    for (var i = 0; i < COUNT; i++) {
      var el = makeTile();
      refresh(el, i);
      root.appendChild(el);
      tiles.push(el);
    }

    // The spawn/despawn churn IS the case, so it replaces the shared damage
    // driver (AUTHORING.md rule 6). Runs every frame - see the ADAPTED note.
    function frame() {
      t += 1;
      if (USE_POOL) {
        for (var j = 0; j < tiles.length; j++) refresh(tiles[j], j);
      } else {
        while (root.firstChild) root.removeChild(root.firstChild);
        tiles.length = 0;
        for (var k = 0; k < COUNT; k++) {
          var fresh = makeTile();
          refresh(fresh, k);
          root.appendChild(fresh);
          tiles.push(fresh);
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
