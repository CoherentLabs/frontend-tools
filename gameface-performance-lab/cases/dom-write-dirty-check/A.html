<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .counter {
    position: absolute; width: 88px; height: 64px; border-radius: 6px;
    background: #2a4a6a; color: #e8e8f0; font-size: 16px;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Each counter's value changes only every 10 frames. A writes only when the
    // value actually changed; B writes every frame regardless. Both pages carry
    // both paths so the scripts stay byte-identical apart from this constant.
    var WRITE_ALWAYS = false;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var counters = [];
    var lastWritten = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'counter';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      root.appendChild(el);
      counters.push(el);
      lastWritten.push(null);
    }

    // The staggered offset means roughly one counter in ten changes on any
    // given frame, which is the realistic shape: a HUD full of values that
    // update at their own pace, driven by a render loop that runs every frame.
    var t = 0;
    function frame() {
      t += 1;
      for (var j = 0; j < counters.length; j++) {
        var value = Math.floor((t + j) / 10);
        if (WRITE_ALWAYS) {
          counters[j].textContent = value;
        } else if (value !== lastWritten[j]) {
          counters[j].textContent = value;
          lastWritten[j] = value;
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
