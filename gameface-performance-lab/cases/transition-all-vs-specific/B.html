<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile {
    position: absolute; width: 88px; height: 64px; border-radius: 6px;
    background: #2a4a6a;
    transition: all 0.3s;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var tiles = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      root.appendChild(el);
      tiles.push(el);
    }

    // Only transform ever changes, in both variants. The transition lasts about
    // as long as the flip interval, so a transition is always in flight and the
    // trace window never catches the page at rest.
    var t = 0;
    function frame() {
      t += 1;
      if (t % 10 === 0) {
        var out = Math.floor(t / 10) % 2 === 0;
        for (var j = 0; j < tiles.length; j++) {
          tiles[j].style.transform = out ? 'translateX(20px)' : 'translateX(0px)';
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
