<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile {
    position: absolute;
    width: 88px;
    height: 64px;
    background-image: url('sprite.svg');
    background-size: 88px 64px;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');

    function makeTile(i) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      return el;
    }

    for (var i = 0; i < COUNT; i++) root.appendChild(makeTile(i));

    // The churn is this case's damage driver (AUTHORING.md rule 6), NOT its
    // variable: it is byte-identical in both variants and only the texture the
    // recreated tiles reference differs. Every tile is destroyed and rebuilt
    // every frame, which is what a pagination click does to a row of cells -
    // see the ADAPTED note in case.json for what the ratio therefore means.
    function frame() {
      while (root.firstChild) root.removeChild(root.firstChild);
      for (var k = 0; k < COUNT; k++) root.appendChild(makeTile(k));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
