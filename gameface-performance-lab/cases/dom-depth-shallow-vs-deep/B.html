<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .cell { position: absolute; width: 88px; height: 64px; }
  .w { display: flex; width: 100%; height: 100%; }
  .tile { width: 100%; height: 100%; background: #2a4a6a; border-radius: 6px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // The wrapper depth between the positioned cell and the visible tile.
    // Everything else about the two pages is identical.
    var DEPTH = 20;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    for (var i = 0; i < COUNT; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      cell.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';

      // Nest DEPTH flex wrappers, then the tile at the leaf. Every wrapper is
      // explicitly sized, so this measures depth alone rather than the cost of
      // auto-sizing (which percentage-vs-fixed-sizing covers separately).
      var host = cell;
      for (var d = 0; d < DEPTH; d++) {
        var w = document.createElement('div');
        w.className = 'w';
        host.appendChild(w);
        host = w;
      }

      var tile = document.createElement('div');
      tile.className = 'tile';
      host.appendChild(tile);
      root.appendChild(cell);
    }

    var t = 0;
    function frame() {
      t += 1;
      root.style.transform = 'translateX(' + (t % 3) + 'px)';
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
