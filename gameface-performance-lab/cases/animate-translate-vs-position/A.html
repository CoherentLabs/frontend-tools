<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .mover {
    position: absolute;
    width: 56px;
    height: 40px;
    background: #7a4ab0;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A moves with a transform; B moves with left. Both pages carry both paths
    // so the scripts stay byte-identical apart from this one constant.
    var USE_TRANSFORM = true;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var movers = [];
    var baseLeft = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'mover';
      var left = 16 + (i % COLS) * CELL_W;
      el.style.left = left + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      root.appendChild(el);
      movers.push(el);
      baseLeft.push(left);
    }

    // The movement is the subject of this case, so it replaces the shared
    // damage driver (AUTHORING.md rule 6). Fixed rate from load, both variants.
    var t = 0;
    function frame() {
      t += 1;
      for (var j = 0; j < movers.length; j++) {
        var dx = (((t + j * 5) % 32) - 16);
        if (USE_TRANSFORM) {
          movers[j].style.transform = 'translateX(' + dx + 'px)';
        } else {
          movers[j].style.left = (baseLeft[j] + dx) + 'px';
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
