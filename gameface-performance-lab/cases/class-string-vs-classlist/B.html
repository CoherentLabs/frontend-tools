<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile {
    position: absolute;
    width: 88px;
    height: 64px;
    border-radius: 6px;
    background: #2a4a6a;
  }
  .tile.hot { background: #c04a4a; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A toggles the class through classList; B rewrites the whole className
    // string. Both pages carry both paths so the scripts stay byte-identical
    // apart from this one constant.
    var USE_CLASSLIST = false;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var tiles = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      root.appendChild(el);
      tiles.push(el);
    }

    // The class churn is the subject of this case, so it replaces the shared
    // damage driver (AUTHORING.md rule 6). Fixed rate from load, both variants.
    var t = 0;
    function frame() {
      t += 1;
      for (var j = 0; j < tiles.length; j++) {
        var on = ((t + j) % 2) === 0;
        if (USE_CLASSLIST) {
          if (on) tiles[j].classList.add('hot');
          else tiles[j].classList.remove('hot');
        } else {
          tiles[j].className = on ? 'tile hot' : 'tile';
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
