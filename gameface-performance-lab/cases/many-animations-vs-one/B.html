<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile { position: absolute; width: 88px; height: 64px; border-radius: 6px; background: #2a4a6a; }
  @keyframes drift {
    from { transform: translateX(0px); }
    to   { transform: translateX(24px); }
  }
  /* Applied to the container in A, and to every tile in B. Either way the
     tiles end up drifting the same distance at the same rate. */
  .animated { animation: drift 2s infinite alternate; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A runs ONE animation, on the container. B runs COUNT animations, one per
    // tile. Both pages carry both paths so the scripts stay byte-identical apart
    // from this one constant.
    var ANIMATE_EACH = true;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = ANIMATE_EACH ? 'tile animated' : 'tile';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      root.appendChild(el);
    }

    if (!ANIMATE_EACH) root.className = 'animated';

    // The animation itself is the churn - it changes a transform every frame in
    // both variants, so no separate damage driver is needed.
  </script>
</body>
</html>
