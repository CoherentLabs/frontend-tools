<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile {
    position: absolute;
    width: 88px;
    height: 64px;
    background-image: url('pattern.png');
    background-position: 0px 0px;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A shifts the artwork by transforming the layer; B shifts it by moving the
    // background inside a stationary layer. Both pages carry both paths so the
    // scripts stay byte-identical apart from this one constant.
    var USE_TRANSFORM = true;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 100;

    var COLS = 20, CELL_W = 92, CELL_H = 68;

    var root = document.getElementById('root');
    var tiles = [];
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.style.left = (16 + (i % COLS) * CELL_W) + 'px';
      el.style.top = (16 + Math.floor(i / COLS) * CELL_H) + 'px';
      root.appendChild(el);
      tiles.push(el);
    }

    // The scroll IS the case, so it replaces the shared damage driver. Both
    // variants shift the artwork by the same number of pixels every frame.
    var t = 0;
    function frame() {
      t += 1;
      var dx = t % 88;
      for (var j = 0; j < tiles.length; j++) {
        if (USE_TRANSFORM) {
          tiles[j].style.transform = 'translateX(' + dx + 'px)';
        } else {
          tiles[j].style.backgroundPosition = (-dx) + 'px 0px';
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
