<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* The pre-composited single layer. */
  .opaque { background: #2f4a63; }
  /* One of N stacked translucent layers that together approximate it. */
  .translucent { background: rgba(51, 119, 187, 0.25); }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // A draws one opaque full-screen layer; B stacks COUNT translucent ones
    // that must each be blended into the framebuffer. Both pages carry both
    // paths so the scripts stay byte-identical apart from this one constant.
    var STACK_TRANSLUCENT = false;

    var match = /[?&]count=(\d+)/.exec(location.search);
    var COUNT = match ? parseInt(match[1], 10) : 5;

    var root = document.getElementById('root');

    if (STACK_TRANSLUCENT) {
      for (var i = 0; i < COUNT; i++) {
        var layer = document.createElement('div');
        layer.className = 'layer translucent';
        root.appendChild(layer);
      }
    } else {
      var single = document.createElement('div');
      single.className = 'layer opaque';
      root.appendChild(single);
    }

    var t = 0;
    function frame() {
      t += 1;
      root.style.transform = 'translateX(' + (t % 3) + 'px)';
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
